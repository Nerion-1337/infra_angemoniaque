# DEV — projet "angemoniaque-dev" : conteneurs ange-dev-*, base/volumes/réseau séparés de la prod, ports différents.
# node_modules vivent dans des volumes nommés (jamais sur l'hôte). Sources montées => rechargement à chaud.
name: angemoniaque-dev
services:
  postgres:
    container_name: ange-dev-postgres
    image: postgres:16
    env_file: .env
    ports: ["5433:5432"]
    volumes: [pgdata_dev:/var/lib/postgresql/data, ./db:/docker-entrypoint-initdb.d:ro]
    healthcheck: { test: ["CMD-SHELL","pg_isready -U $${POSTGRES_USER}"], interval: 5s, retries: 10 }
  redis:
    container_name: ange-dev-redis
    image: redis:7
    healthcheck: { test: ["CMD","redis-cli","ping"], interval: 5s, retries: 10 }
  backend:
    container_name: ange-dev-backend
    image: angemoniaque-backend:dev
    build: { context: "${BACKEND_PATH:-../backend}", target: dev }
    env_file: .env
    environment: { DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}", REDIS_URL: "redis://redis:6379" }
    volumes: ["${BACKEND_PATH:-../backend}:/app", "backend_modules_dev:/app/node_modules"]
    ports: ["3001:3000"]
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_healthy } }
  frontend:
    container_name: ange-dev-frontend
    image: angemoniaque-frontend:dev
    build: { context: "${FRONTEND_PATH:-../frontend}", target: dev }
    environment: { API_URL: "http://backend:3000", CHOKIDAR_USEPOLLING: "true" }
    volumes: ["${FRONTEND_PATH:-../frontend}:/app", "frontend_modules_dev:/app/node_modules"]
    depends_on: [backend]
  nginx:
    container_name: ange-dev-nginx
    image: nginx:1.27
    ports: ["8080:80"]
    volumes: [./nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro]
    depends_on: [backend, frontend]
  pgadmin:
    container_name: ange-dev-pgadmin
    image: dpage/pgadmin4
    env_file: .env
    ports: ["5051:80"]
volumes: { pgdata_dev: {}, backend_modules_dev: {}, frontend_modules_dev: {} }
