# Surcharge de développement : sources montées, node_modules UNIQUEMENT dans les conteneurs (volume anonyme).
services:
  backend:
    build: { context: "${BACKEND_PATH:-../backend}", target: dev }
    volumes: ["${BACKEND_PATH:-../backend}:/app", "/app/node_modules"]
    ports: ["3000:3000"]
  frontend:
    build: { context: "${FRONTEND_PATH:-../frontend}", target: dev }
    environment: { API_URL: "http://backend:3000", CHOKIDAR_USEPOLLING: "true" }
    volumes: ["${FRONTEND_PATH:-../frontend}:/app", "/app/node_modules"]
    ports: ["5173:5173"]
  nginx:
    volumes: ["./nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro"]
  postgres:
    ports: ["5432:5432"]
