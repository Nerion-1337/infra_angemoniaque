# PROD — projet "angemoniaque-prod" : conteneurs ange-prod-*, volumes et réseau propres, images :prod
name: angemoniaque-prod
services:
  postgres:
    container_name: ange-prod-postgres
    image: postgres:16
    env_file: .env
    volumes: [pgdata:/var/lib/postgresql/data, ./db:/docker-entrypoint-initdb.d:ro]
    healthcheck: { test: ["CMD-SHELL","pg_isready -U $${POSTGRES_USER}"], interval: 5s, retries: 10 }
  redis:
    container_name: ange-prod-redis
    image: redis:7
    healthcheck: { test: ["CMD","redis-cli","ping"], interval: 5s, retries: 10 }
  backend:
    container_name: ange-prod-backend
    image: angemoniaque-backend:prod
    build: { context: "${BACKEND_PATH:-../backend}" }
    env_file: .env
    environment: { DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}", REDIS_URL: "redis://redis:6379" }
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_healthy } }
  frontend:
    container_name: ange-prod-frontend
    image: angemoniaque-frontend:prod
    build: { context: "${FRONTEND_PATH:-../frontend}" }
    depends_on: [backend]
  nginx:
    container_name: ange-prod-nginx
    image: nginx:1.27
    ports: ["80:80"]
    volumes: [./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro]
    depends_on: [backend, frontend]
  pgadmin:
    container_name: ange-prod-pgadmin
    image: dpage/pgadmin4
    env_file: .env
    ports: ["5050:80"]
  portainer:
    container_name: ange-prod-portainer
    image: portainer/portainer-ce
    ports: ["9000:9000"]
    volumes: [/var/run/docker.sock:/var/run/docker.sock, portainer:/data]
volumes: { pgdata: {}, portainer: {} }
