map $http_upgrade $conn { default upgrade; '' close; }
server {
  listen 80;
  # DNS interne Docker relu toutes les 10 s : un conteneur recréé change d'IP (sinon 502 jusqu'au redémarrage de Nginx).
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $backend http://backend:3000;
  set $frontend http://frontend:80;
  server_tokens off;
  # En-têtes de sécurité : pas d'intégration en iframe, pas de reniflage de type, CSP (scripts du site seulement ; polices Google).
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' ws: wss:; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
  location /api/ {
    rewrite ^/api/(.*)$ /$1 break;   # /api retiré (avec une variable, proxy_pass ne remplace plus le préfixe)
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $conn;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;           # IP du client pour la limitation de débit (écrase toute valeur envoyée par le client)
    proxy_set_header X-Forwarded-Host $http_host;   # hôte:port vu du navigateur (retour de la connexion Google)
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  # Code de l'interface admin (paquet séparé du build) : servi SEULEMENT si le back valide le cookie admin (compte admin en base).
  location /assets-admin/ { auth_request /_admin_check; proxy_pass $frontend; }
  location = /_admin_check {
    internal;
    proxy_pass $backend/auth/admin-asset;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Real-IP $remote_addr;
  }
  location / { proxy_pass $frontend; }
}
