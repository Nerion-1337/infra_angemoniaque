map $http_upgrade $conn { default upgrade; '' close; }
server {
  listen 80;
  # DNS interne Docker, relu toutes les 10 s : un backend / frontend recréé (up --build) change d'adresse IP ; avec un nom
  # fixe dans proxy_pass, Nginx garderait l'ancienne adresse résolue au démarrage → 502 jusqu'à son redémarrage.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $backend http://backend:3000;
  set $frontend http://frontend:5173;
  add_header X-Content-Type-Options nosniff always; add_header X-Frame-Options DENY always; add_header Referrer-Policy strict-origin-when-cross-origin always;
  location /api/ { rewrite ^/api/(.*)$ /$1 break; proxy_pass $backend; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $conn; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-Host $http_host; proxy_set_header X-Forwarded-Proto $scheme; }
  # Sources de l'interface admin (serveur Vite) : servies seulement à un admin vérifié par le back (cookie admin).
  location ~ /src/admin/ { auth_request /_admin_check; proxy_pass $frontend; proxy_http_version 1.1; proxy_set_header Host $host; }
  location = /_admin_check { internal; proxy_pass $backend/auth/admin-asset; proxy_pass_request_body off; proxy_set_header Content-Length ""; }
  location / { proxy_pass $frontend; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $conn; proxy_set_header Host $host; }   # HMR Vite
}
