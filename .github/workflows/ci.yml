name: infra-ci
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres: { image: "postgres:16", env: { POSTGRES_USER: ange, POSTGRES_PASSWORD: ange, POSTGRES_DB: angemoniaque }, ports: ["5432:5432"], options: "--health-cmd pg_isready --health-interval 5s --health-retries 10" }
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f docker-compose.dev.yml --env-file .env.example config -q && docker compose -f docker-compose.prod.yml --env-file .env.example config -q
      - run: sudo apt-get install -y postgresql-client && ./scripts/check-sql.sh
      - run: docker run --rm -v $PWD/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro --add-host backend:127.0.0.1 --add-host frontend:127.0.0.1 nginx:1.27 nginx -t
